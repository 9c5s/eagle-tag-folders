pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{ts,vue}"
      stage_fixed: true
      run: npx eslint --fix {staged_files}
    prettier:
      glob: "*.{ts,vue,scss,css,json,md}"
      stage_fixed: true
      run: npx prettier --write {staged_files}
    typecheck:
      run: npx vue-tsc --noEmit
    test:
      run: npx vitest run

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
